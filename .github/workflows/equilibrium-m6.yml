name: Equilibrium M6
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
# Only PR runs share a group; pending push and merge-group runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  d8_psi:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    timeout-minutes: 30
    env:
      FC: gfortran-14
      CC: gcc-14
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 1
      OMP_WAIT_POLICY: passive
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh equilibrium-m6-d8
        env:
          SCI_MATRIX_LANE: psi
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: equilibrium-m6-d8
          SCI_MATRIX_LANE: psi
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build gfortran-14 gcc-14 libopenblas-dev liblapack-dev libsuitesparse-dev libmetis-dev libnetcdf-dev
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKIN6D_BUILD_EXTRAS=OFF -DKIN6D_CHECK_LEAN=OFF
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build affected consumers
        run: cmake --build build -j 4 --target test_equilibrium_harness test_gs_fb_manufactured test_ideal_map_axisymmetric
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Check registry and layering
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(equilibrium_d8_registry_contract|kin6d_layering)$'
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Check psi ladders and offsets
        if: ${{ github.event.pull_request.head.repo.fork && ('psi' == 'psi') }}
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(equilibrium_d8_psi_offset_.*|gs_free_boundary_t3_manufactured_newton)$'
      - name: Check map ladders and offset returns
        if: ${{ github.event.pull_request.head.repo.fork && ('psi' == 'map') }}
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(ideal_seed_boundary_label|ideal_map_n0_(solovev_a3_p[23]|shaped_solovev_p[23]|seed_return_(a3_p[23]|shaped_p2)|seed_nested_(a3_p[23]|shaped_p3)))$'
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: d8 (psi)
  d8_map:
    runs-on: ${{ github.event.pull_request.head.repo.fork && fromJSON('["self-hosted","itp-ubuntu24"]') || (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && fromJSON('["self-hosted","itp-slurm"]') || fromJSON('["self-hosted","itp-build"]') }}
    # The existing shaped P3 case permits 80 minutes; allow the full tier.
    timeout-minutes: 120
    env:
      FC: gfortran-14
      CC: gcc-14
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 1
      OMP_WAIT_POLICY: passive
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run native checks in the build container
        if: ${{ !github.event.pull_request.head.repo.fork && !(github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          ci/run.sh equilibrium-m6-d8
        env:
          SCI_MATRIX_LANE: map
      - name: Bundle exact sources for Slurm
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        env:
          SCI_TIER: equilibrium-m6-d8
          SCI_MATRIX_LANE: map
        run: |-
          TMPDIR="$RUNNER_TEMP" ci/bundle.sh "$RUNNER_TEMP/ci.tar.zst"
      - name: Run native checks on sCluster
        if: ${{ !github.event.pull_request.head.repo.fork && (github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
        run: |-
          sci-dispatch native "$RUNNER_TEMP/ci.tar.zst"
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build gfortran-14 gcc-14 libopenblas-dev liblapack-dev libsuitesparse-dev libmetis-dev libnetcdf-dev
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKIN6D_BUILD_EXTRAS=OFF -DKIN6D_CHECK_LEAN=OFF
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Build affected consumers
        run: cmake --build build -j 4 --target test_equilibrium_harness test_gs_fb_manufactured test_ideal_map_axisymmetric
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Check registry and layering
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(equilibrium_d8_registry_contract|kin6d_layering)$'
        if: ${{ github.event.pull_request.head.repo.fork }}
      - name: Check psi ladders and offsets
        if: ${{ github.event.pull_request.head.repo.fork && ('map' == 'psi') }}
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(equilibrium_d8_psi_offset_.*|gs_free_boundary_t3_manufactured_newton)$'
      - name: Check map ladders and offset returns
        if: ${{ github.event.pull_request.head.repo.fork && ('map' == 'map') }}
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(ideal_seed_boundary_label|ideal_map_n0_(solovev_a3_p[23]|shaped_solovev_p[23]|seed_return_(a3_p[23]|shaped_p2)|seed_nested_(a3_p[23]|shaped_p3)))$'
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    name: d8 (map)

name: Equilibrium M6
on:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d8:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [psi, map]
    env:
      FC: gfortran-14
      CC: gcc-14
      OMP_NUM_THREADS: 4
      OPENBLAS_NUM_THREADS: 1
      OMP_WAIT_POLICY: passive
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build gfortran-14 gcc-14 libopenblas-dev liblapack-dev libmumps-seq-dev libsuitesparse-dev libmetis-dev libnetcdf-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DKIN6D_BUILD_EXTRAS=OFF -DKIN6D_CHECK_LEAN=OFF
      - name: Build affected consumers
        run: cmake --build build -j 4 --target test_equilibrium_harness test_gs_fb_manufactured test_ideal_map_axisymmetric
      - name: Check registry and layering
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(equilibrium_d8_registry_contract|kin6d_layering)$'
      - name: Check psi ladders and offsets
        if: matrix.lane == 'psi'
        run: ctest --test-dir build -j 4 --output-on-failure -R '^(equilibrium_d8_psi_offset_.*|gs_free_boundary_t3_manufactured_newton)$'
      - name: Check map ladders and offset returns
        if: matrix.lane == 'map'
        run: ctest --test-dir build -j 4 --output-on-failure -R '^ideal_map_n0_(solovev_a3_p[23]|shaped_solovev_p[23]|seed_return_(a3_p[23]|shaped_p2)|seed_nested_(a3_p[23]|shaped_p3))$'

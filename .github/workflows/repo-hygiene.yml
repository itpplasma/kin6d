name: Repository hygiene
on:
  pull_request:
  merge_group:
permissions:
  contents: read
# Only PR runs share a group; pending push and merge-group runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene-run:
    if: github.event_name != 'pull_request'
    uses: itpplasma/.github/.github/workflows/repo-hygiene.yml@04da3fc73d9ead713b93700de7bbf54049b5ac3e
    with:
      hygiene-revision: 04da3fc73d9ead713b93700de7bbf54049b5ac3e

  # The required context stays static while the reusable job runs only in CI.
  repo-hygiene:
    name: repo-hygiene / repo-hygiene
    needs: hygiene-run
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful shared hygiene workflow
        env:
          RESULT: ${{ needs.hygiene-run.result }}
        run: test "$RESULT" = success

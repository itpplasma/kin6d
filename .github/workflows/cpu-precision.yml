name: CPU precision comparisons
on:
  pull_request:
    paths:
      - 'app/benchmark_cpu_precision.f90'
      - 'src/generated/kin6d_*_cpu_precision.f90'
      - 'gen/**'
      - 'cmake/kin6d_cpu_precision.cmake'
      - 'benchmarks/cpu-precision/**'
      - '.github/workflows/cpu-precision.yml'
  merge_group:
  workflow_dispatch:
jobs:
  comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran ninja-build
      - name: Build the native CPU benchmark
        run: >-
          cmake -S benchmarks/cpu-precision -B build-cpu-precision -G Ninja
          -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-cpu-precision --target benchmark_cpu_precision -j 2
      - name: Compare generated variants and independent analytic values
        run: >-
          ctest --test-dir build-cpu-precision -j 2
          -R '^cpu_precision_' --output-on-failure
